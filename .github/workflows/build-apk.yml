# AIS Terminal — builds the Android APK on every push.
# Download it from the run page → Artifacts → "ais-terminal-debug-apk".
name: Build APK

on:
  push:
    branches: [main, ais-terminal]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Build debug APK
        run: ./gradlew :app:assembleOssDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ais-terminal-debug-apk
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error

      # Optional signed release build. Add repository secrets KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD and KEYSTORE_ALIAS to enable it; push a tag like v1.0.0.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleOssRelease --stacktrace \
            -PkeystoreFile="$RUNNER_TEMP/release.jks" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeystoreAlias="$KEYSTORE_ALIAS"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/oss/debug/*.apk
            app/build/outputs/apk/oss/release/*.apk
          fail_on_unmatched_files: false
