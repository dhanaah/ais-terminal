# AIS Terminal — builds the Android APK on every push.
# Download it from the run page → Artifacts → "ais-terminal-debug-apk".
name: Build APK

on:
  push:
    branches: [main, ais-terminal]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleOssDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ais-terminal-debug-apk
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error

      # Optional signed release build. Add repository secrets KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD and KEYSTORE_ALIAS to enable it; push a tag like v1.0.0.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleOssRelease --stacktrace \
            -PkeystoreFile="$RUNNER_TEMP/release.jks" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeystoreAlias="$KEYSTORE_ALIAS"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/oss/debug/*.apk
            app/build/outputs/apk/oss/release/*.apk
          fail_on_unmatched_files: false
